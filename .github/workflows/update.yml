name: Actualizar precios y publicar

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # cada ~15 min en minutos poco transitados; GitHub puede retrasarlo
  workflow_dispatch:
    inputs:
      full:
        description: 'Forzar barrido completo del catálogo'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola ejecución a la vez para no duplicar peticiones a la API
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Descargar precios (conserva el dato anterior si la API falla)
        env:
          PREV_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_FULL: ${{ inputs.full && '1' || '0' }}
          SERVER: west
          FULL_EVERY_MIN: 90
        run: node scripts/fetch-prices.mjs

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
